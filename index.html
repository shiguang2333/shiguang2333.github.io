<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SP幸运卡牌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        body { background-color: #0c0a09; background-image: radial-gradient(circle at center, #1a1714 0%, #0c0a09 100%); font-family: 'Inter', sans-serif; color: #d6d3d1; }

        /* From Uiverse.io by MuhammadHasann */
        .button {
            --black-700: hsla(0 0% 12% / 1);
            --border_radius: 9999px;
            --transtion: 0.3s ease-in-out;
            --offset: 2px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform-origin: center;
            padding: 1rem 2rem;
            background-color: transparent;
            border: none;
            border-radius: var(--border_radius);
            transform: scale(calc(1 + (var(--active, 0) * 0.1)));
            transition: transform var(--transtion);
        }
        .button::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-color: var(--btn-bg, var(--black-700));
            border-radius: var(--border_radius);
            box-shadow: inset 0 0.5px hsl(0, 0%, 100%), inset 0 -1px 2px 0 hsl(0, 0%, 0%), 0px 4px 10px -4px hsla(0 0% 0% / calc(1 - var(--active, 0))), 0 0 0 calc(var(--active, 0) * 0.375rem) var(--btn-glow, hsl(35 92% 50% / 0.75));
            transition: all var(--transtion);
            z-index: 0;
            pointer-events: none;
        }
        .button::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-color: var(--btn-hover-bg, hsla(35 92% 50% / 0.75));
            background-image: var(--btn-hover-img, radial-gradient(at 51% 89%, hsl(42, 100%, 70%) 0px, transparent 50%), radial-gradient(at 100% 100%, hsl(35, 92%, 50%) 0px, transparent 50%), radial-gradient(at 22% 91%, hsl(35, 92%, 45%) 0px, transparent 50%));
            background-position: top;
            opacity: var(--active, 0);
            border-radius: var(--border_radius);
            transition: opacity var(--transtion);
            z-index: 2;
            pointer-events: none;
        }
        .button:is(:hover, :focus-visible) { --active: 1; }

        .btn-white { --btn-glow: rgba(0,0,0,0.25); --btn-hover-bg: rgba(0,0,0,0.15); --btn-hover-img: none; }
        .btn-white:is(:hover, :focus-visible) { --btn-bg: #e8e6e3; }
        .btn-white:is(:hover, :focus-visible) .text_button { background-image: linear-gradient(90deg, #1a1a1a 0%, #555 120%); }

        .btn-orange { --btn-glow: rgba(255,255,255,0.3); --btn-hover-bg: rgba(255,255,255,0.2); --btn-hover-img: none; }
        .btn-orange:is(:hover, :focus-visible) { --btn-bg: #c2410c; }
        .btn-orange:is(:hover, :focus-visible) .text_button { background-image: linear-gradient(90deg, #000 0%, #333 120%); }

        .btn-red { --btn-glow: rgba(255,255,255,0.3); --btn-hover-bg: rgba(255,255,255,0.2); --btn-hover-img: none; }
        .btn-red:is(:hover, :focus-visible) { --btn-bg: #b91c1c; }
        .btn-red:is(:hover, :focus-visible) .text_button { background-image: linear-gradient(90deg, #000 0%, #333 120%); }
        .button:active { transform: scale(1); }
        .button .dots_border {
            --size_border: calc(100% + 2px);
            overflow: hidden;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--size_border);
            height: var(--size_border);
            background-color: transparent;
            border-radius: var(--border_radius);
            z-index: -10;
        }
        .button .dots_border::before {
            content: "";
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: left;
            transform: rotate(0deg);
            width: 100%;
            height: 2rem;
            background-color: white;
            mask: linear-gradient(transparent 0%, white 120%);
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .text_button, .button .text_button {
            position: relative;
            z-index: 10;
            background-image: linear-gradient(90deg, hsla(0 0% 100% / 1) 0%, hsla(0 0% 100% / var(--active, 0)) 120%);
            background-clip: text;
            font-size: 1rem;
            color: transparent;
        }
        .card-item {
            aspect-ratio: 3/2;
            background: #212121;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(217,119,6,0.25);
        }
        .card-item.revealed { border-color: transparent; }
        .card-item .border-line {
            position: absolute;
            inset: 0;
            border: 2px solid #d97706;
            opacity: 0;
            transform: rotate(10deg);
            transition: all 0.5s ease-in-out;
            pointer-events: none;
            border-radius: 10px;
            box-shadow: 0 0 6px rgba(217,119,6,0.5);
        }
        .card-item .card-content {
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0 8px;
        }
        .card-item .card-content > div:first-child {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-in-out;
            font-size: 11px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            background: #212121;
            padding: 2px 6px;
            z-index: 3;
        }
        .card-item.active .card-content > div:first-child,
        .card-item.revealed .card-content > div:first-child {
            top: 24px;
            transform: translateX(-50%);
            font-size: 8px;
            opacity: 0.6;
        }
        .card-item .card-value {
            display: none;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            position: relative;
            z-index: 1;
        }
        .card-item.revealed {
            border-radius: 0;
            transform: scale(1.05);
        }
        .card-item.revealed .border-line {
            inset: 8px;
            opacity: 1;
            transform: rotate(0);
            box-shadow: 0 0 12px rgba(217,119,6,0.7), inset 0 0 8px rgba(251,191,36,0.2);
        }
        .card-item.active .card-value { display: block; }
        .card-item.revealed .card-value {
            display: block;
            animation: valuePop 0.4s ease-in-out;
        }
        @keyframes valuePop {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card-item.active .border-line {
            animation: borderSpin 0.6s ease-in-out forwards;
        }
        @keyframes borderSpin {
            0% { inset: 0; opacity: 0; transform: rotate(10deg); }
            100% { inset: 8px; opacity: 1; transform: rotate(0); }
        }
        /* From Uiverse.io by ShrinilDhorda */
        .btn-result {
            font-size: 1.2rem;
            padding: 1rem 2.5rem;
            border: none;
            outline: none;
            border-radius: 0.4rem;
            cursor: pointer;
            text-transform: uppercase;
            background-color: #1a1817;
            color: #fbbf24;
            font-weight: 700;
            transition: 0.6s;
            box-shadow: 0px 0px 60px rgba(217, 119, 6, 0.4);
            -webkit-box-reflect: below 10px linear-gradient(to bottom, rgba(0,0,0,0.0), rgba(0,0,0,0.4));
            display: none;
            opacity: 0;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-result.show {
            display: block;
            opacity: 1;
        }
        .btn-result:active { scale: 0.92; }
        .btn-result:hover {
            background: #d97706;
            color: #1a1817;
        }
        .modal-overlay { background: #212121; transition: opacity 0.5s; }
        .modal-overlay.fade-out { opacity: 0; }
        #main-container { opacity: 0; transform: scale(0.95); transition: opacity 0.5s, transform 0.5s, padding-bottom 0.6s; }
        #main-container.fade-in { opacity: 1; transform: scale(1); }


        /* From Uiverse.io by ElSombrero2 */
        .result-card {
            overflow: visible;
            width: 100%;
            max-width: 384px;
            aspect-ratio: 190/254;
            margin: 0 auto;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.6s ease, transform 0.6s ease;
            display: none;
        }
        .result-card.show {
            opacity: 1;
            transform: scale(1);
            display: block;
        }
        .result-card .content {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 300ms;
            box-shadow: 0px 0px 10px 1px #000000ee;
            border-radius: 5px;
        }
        .result-card .content .front,
        .result-card .content .back {
            background-color: #151515;
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 5px;
            overflow: hidden;
        }
        .result-card .content .back {
            width: 100%;
            height: 100%;
            justify-content: center;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .result-card .content .back::before {
            position: absolute;
            content: ' ';
            display: block;
            width: 160px;
            height: 160%;
            background: linear-gradient(90deg, transparent, #ff9966, #ff9966, #ff9966, #ff9966, transparent);
            animation: rotation_481 5000ms infinite linear;
        }
        .result-card .content .back .back-content {
            position: absolute;
            width: 99%;
            height: 99%;
            background-color: #151515;
            border-radius: 5px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .result-card.flipped .content {
            transform: rotateY(180deg);
        }
        @keyframes rotation_481 {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }
        .result-card .content .front {
            transform: rotateY(180deg);
            color: white;
        }
        .result-card .content .front .front-content {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .result-card .content .front .front-content .badge {
            background-color: #00000055;
            padding: 2px 10px;
            border-radius: 10px;
            backdrop-filter: blur(2px);
            width: fit-content;
        }
        .result-card .content .front .front-content .description {
            box-shadow: 0px 0px 10px 5px #00000088;
            width: 100%;
            padding: 18px 10px;
            background-color: #00000099;
            backdrop-filter: blur(5px);
            border-radius: 5px;
        }
        .result-card .content .front .front-content .description .title {
            font-size: 11px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .result-card .content .front .front-content .description .title p {
            width: 50%;
        }
        .result-card .content .front .front-content .description .card-footer {
            color: #ffffff88;
            margin-top: 5px;
            font-size: 8px;
        }
        .result-card .content .front .img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .result-card .content .front .img .circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #ffbb66;
            position: relative;
            filter: blur(15px);
            animation: floating 2600ms infinite linear;
        }
        .result-card .content .front .img #bottom {
            background-color: #ff8866;
            left: 50px;
            top: 0px;
            width: 150px;
            height: 150px;
            animation-delay: -800ms;
        }
        .result-card .content .front .img #right {
            background-color: #ff2233;
            left: 160px;
            top: -80px;
            width: 30px;
            height: 30px;
            animation-delay: -1800ms;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(0px); }
        }
        #result-title { font-size: 29px; }
        #count-display { font-size: 20px; }
        #main-container.card-mode {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
            transition: background 0.6s, box-shadow 0.6s, border-radius 0.6s, padding 0.6s;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="diff-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="bg-[#212121] rounded-3xl w-full max-w-[280px] p-8 text-center" style="box-shadow:15px 15px 30px rgb(25,25,25),-15px -15px 30px rgb(60,60,60);">
            <h2 class="text_button tracking-[0.2em] uppercase" style="font-size:12px; margin-bottom:2rem; letter-spacing:0.2em;">选择惩罚程度</h2>
            <div class="flex flex-col gap-4 w-full items-center">
                <button onclick="selectDiff(30, 50, 30)" class="button btn-white w-full justify-center">
                    <div class="dots_border"></div>
                    <span class="text_button">轻度</span>
                </button>
                <button onclick="selectDiff(50, 80, 60)" class="button btn-orange w-full justify-center">
                    <div class="dots_border"></div>
                    <span class="text_button">中度</span>
                </button>
                <button onclick="selectDiff(80, 110, 80)" class="button btn-red w-full justify-center">
                    <div class="dots_border"></div>
                    <span class="text_button">重度</span>
                </button>
            </div>
        </div>
    </div>

    <div id="main-container" class="w-full max-w-sm p-6 text-center" style="background:#212121;border-radius:30px;box-shadow:15px 15px 30px rgb(25,25,25),-15px -15px 30px rgb(60,60,60);">
        <div class="flex justify-center items-center gap-4 mb-4">
            <p class="text-[10px] text-stone-500 tracking-[0.2em] uppercase">安全词: 稀得溜的</p>
            <button id="rules-btn" class="text-[10px] text-amber-700 hover:text-amber-500 underline uppercase tracking-[0.1em]">规则</button>
        </div>
        
        <div id="cards-container" class="grid grid-cols-2 gap-3 mb-6 transition-all duration-500">
            <div id="c-0" class="card-item"><div class="border-line"></div><div class="card-content"><div>Tool</div><div class="card-value"></div></div></div>
            <div id="c-1" class="card-item"><div class="border-line"></div><div class="card-content"><div>Pose</div><div class="card-value"></div></div></div>
            <div id="c-2" class="card-item"><div class="border-line"></div><div class="card-content"><div>Count</div><div class="card-value"></div></div></div>
            <div id="c-3" class="card-item"><div class="border-line"></div><div class="card-content"><div>Area</div><div class="card-value"></div></div></div>
        </div>

        <div id="result-card" class="result-card">
            <div class="content">
                <div class="back">
                    <div class="back-content" id="result-back">
                        <div style="font-size:60px;line-height:1;">✋</div>
                        <div style="font-size:40px;letter-spacing:0.1em;text-align:center;color:rgba(255,255,255,0.8);margin-top:8px;">最终结果</div>
                    </div>
                </div>
                <div class="front">
                    <div class="img">
                        <div class="circle"></div>
                        <div class="circle" id="right"></div>
                        <div class="circle" id="bottom"></div>
                    </div>
                    <div class="front-content" style="justify-content:center;gap:8px;">
                        <div class="description" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;">
                            <div class="title" style="display:flex;flex-direction:column;gap:4px;align-items:center;">
                                <p class="title" id="result-title" style="width:100%;text-align:center;"><strong></strong></p>
                                <p class="card-footer" id="result-footer"></p>
                            </div>
                            <div class="flex gap-4 justify-center" style="margin-top:4px;">
                                <button onclick="event.stopPropagation(); updateCountAnim(state.currentCount + 5)" style="padding:4px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#ccc;font-size:11px;cursor:pointer;">+5</button>
                                <button onclick="event.stopPropagation(); updateCountAnim(state.currentCount + 10)" style="padding:4px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#ccc;font-size:11px;cursor:pointer;">+10</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="draw-btn" class="btn-result">显示结果</button>
    </div>

    <div id="rules-modal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="bg-[#1a1515] border border-stone-800 rounded-2xl p-6 w-full max-w-sm max-h-[80vh] overflow-y-auto shadow-2xl text-left">
            <h2 class="text-amber-600 text-[12px] uppercase tracking-[0.2em] mb-4 text-center">惩罚规则与联动</h2>
            <div class="text-[11px] text-stone-400 space-y-3 leading-relaxed">
                <p><strong>工具系数：</strong><br/>x1.0: 马鞭/手掌/猫爪/散鞭<br/>x0.95: 发刷<br/>x0.9: 皮带/小木拍/皮拍<br/>x0.8: 大木拍<br/>x0.7: 皮鞭/藤条</p>
                <p><strong>加罚说明：</strong><br/>1. 报数/声小/报错/求饶 +5次。<br/>2. 乱动/遮挡/躲闪/喊疼 +10次。<br/>(上限50次加罚)</p>
            </div>
            <button id="close-modal" class="mt-6 w-full py-2 bg-stone-900 border border-stone-700 text-stone-300 rounded-lg text-[11px] uppercase tracking-[0.2em]">Close</button>
        </div>
    </div>

    <script>
        const coefficients = { "马鞭": 1, "皮带": 0.9, "手掌": 1, "发刷": 0.95, "皮鞭": 0.7, "小木拍": 0.9, "大木拍": 0.8, "皮拍": 0.9, "藤条": 0.7, "猫爪拍": 1, "散鞭": 1 };
        const clickSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, envelope: { sustain: 0, release: 0.1 } }).toDestination();
        const finishSynth = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, release: 0.2 } }).toDestination();
        const finalRevealSynth = new Tone.PolySynth(Tone.Synth).toDestination();

        function playClick() { try { clickSynth.triggerAttackRelease("C3", "8n"); } catch(e) {} }
        function playStop() { try { finishSynth.triggerAttackRelease("G4", "8n"); } catch(e) {} }
        function playFinal() { try { finalRevealSynth.triggerAttackRelease(["C4", "E4", "G4"], "2n"); } catch(e) {} }

        let state = { step: 0, results: [,,,], diff: {min: 50, max: 80, floor: 60}, isRolling: false, currentCount: 0 };
        const btn = document.getElementById('draw-btn');
        const container = document.getElementById('cards-container');

        function selectDiff(min, max, floor) {
            state.diff = {min, max, floor};
            const modal = document.getElementById('diff-modal');
            modal.classList.add('fade-out');
            document.getElementById('main-container').classList.add('fade-in');
            setTimeout(() => modal.classList.add('hidden'), 500);
        }
        document.getElementById('rules-btn').onclick = () => document.getElementById('rules-modal').classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => document.getElementById('rules-modal').classList.add('hidden');

        async function updateCountAnim(newCount) {
            const display = document.getElementById('count-display');
            const oldCount = state.currentCount;
            const steps = Math.abs(newCount - oldCount);
            const duration = 600;
            const interval = steps === 0 ? 0 : duration / (steps + 1);
            for (let i = 0; i <= steps; i++) {
                const val = newCount >= oldCount ? oldCount + i : oldCount - i;
                display.innerText = val + "次";
                playClick();
                await new Promise(r => setTimeout(r, interval));
            }
            state.currentCount = newCount;
        }

        function getPool(index) {
            if (index === 2) {
                const pool = [];
                for (let i = state.diff.min; i <= state.diff.max; i++) pool.push(i + "次");
                return pool;
            }
            const pools = [["马鞭", "皮带", "手掌", "发刷", "皮鞭", "小木拍", "大木拍", "皮拍", "藤条", "猫爪拍", "散鞭"], ["膝上", "俯卧", "跪姿", "弯腰", "扶手", "尿布", "四足支撑"], [], ["屁股", "大腿根", "脚心", "手心", "小腿肚", "大腿肚", "阴部"]];
            if (index === 3) {
                const pose = state.results[1];
                const tool = state.results[0];
                const legs = (pose !== "膝上" && tool !== "手掌") ? ["小腿肚", "大腿肚"] : [];
                return pose === "膝上" ? ["屁股"] : ["屁股", "大腿根", "阴部", ...(pose === "跪姿" ? ["手心", "胸部"] : []), ...((pose === "俯卧" || pose === "尿布") ? ["脚心"] : []), ...legs];
            }
            return [...pools[index]];
        }

        async function cardClick(index) {
            try { await Tone.start(); } catch(e) {}
            if (state.results[index]) return;
            if (index !== state.step) return;

            const cardEl = document.getElementById(`c-${index}`);
            const valueEl = cardEl.querySelector('.card-value');

            if (state.isRolling) {
                state.isRolling = false;
                return;
            }

            state.isRolling = true;
            cardEl.classList.add('active');
            const pool = getPool(index);

            while (state.isRolling) {
                valueEl.textContent = pool[Math.floor(Math.random() * pool.length)];
                playClick();
                await new Promise(r => setTimeout(r, 100));
            }

            const result = valueEl.textContent;
            cardEl.classList.remove('active');
            cardEl.classList.add('revealed');
            state.results[index] = result;
            playStop();
            state.step++;

            if (state.step === 4) {
                document.getElementById('main-container').style.paddingBottom = '120px';
                btn.style.display = 'block';
                requestAnimationFrame(() => btn.classList.add('show'));
            }
        }

        for (let i = 0; i < 4; i++) document.getElementById(`c-${i}`).onclick = () => cardClick(i);
        btn.onclick = () => { showResult(); btn.classList.remove('show'); document.getElementById('main-container').style.paddingBottom = ''; };

        const mainContainer = document.getElementById('main-container');
        const resultCard = document.getElementById('result-card');

        async function showResult() {
            const header = mainContainer.querySelector('.flex.justify-center');
            container.style.opacity = '0';
            btn.style.opacity = '0';
            if (header) header.style.opacity = '0';
            setTimeout(async () => {
                container.classList.add('hidden');
                btn.style.display = 'none';
                if (header) header.style.display = 'none';
                mainContainer.classList.add('card-mode');

                const rawCount = parseInt(state.results[2]);
                const coeff = coefficients[state.results[0]] || 1;
                const calculatedCount = Math.max(state.diff.floor, Math.round(rawCount * coeff));

                const summary = `${state.results[0]} | ${state.results[1]} | ${state.results[3]}`;
                document.getElementById('result-title').innerHTML = `<strong>${summary}</strong>`;
                document.getElementById('result-footer').innerHTML = `基础惩罚: ${rawCount}次 · <span id="count-display">${rawCount}次</span>`;
                let countStarted = false;
                resultCard.style.display = 'block';
                resultCard.onclick = () => {
                    resultCard.classList.toggle('flipped');
                    if (!countStarted && resultCard.classList.contains('flipped')) {
                        countStarted = true;
                        const content = resultCard.querySelector('.content');
                        const handler = () => {
                            content.removeEventListener('transitionend', handler);
                            state.currentCount = rawCount;
                            updateCountAnim(calculatedCount);
                            playFinal();
                        };
                        content.addEventListener('transitionend', handler);
                    }
                };
                requestAnimationFrame(() => resultCard.classList.add('show'));
            }, 400);
        }
    </script>
</body>
</html>
