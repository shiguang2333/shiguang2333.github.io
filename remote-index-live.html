<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SP幸运卡牌</title>
    <script src="./vendor/tailwind.js"></script>
    <script src="./vendor/Tone.min.js"></script>
    <style>
:root {
    --sp-shell: #1c1c1c;
    --sp-panel: #232120;
    --sp-panel-2: #1b1a19;
    --sp-ink: #eeeae7;
    --sp-muted: #a8a29e;
    --sp-dim: #78716c;
    --sp-gold: #d2ae72;
    --sp-gold-strong: #c49b5f;
    --sp-gold-bright: #e3c08a;
    --sp-amber: #f59e0b;
    --sp-line: rgba(210, 174, 114, 0.34);
    --sp-line-soft: rgba(255, 255, 255, 0.075);
    --sp-danger: #c75c50;
    --sp-radius-card: 14px;
    --sp-radius-control: 12px;
    --sp-radius-modal: 20px;
    --sp-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100% !important; min-height: 0 !important; overflow: hidden !important; }
body {
    margin: 0;
    padding: 16px !important;
    display: grid;
    place-items: center;
    color: var(--sp-ink);
    background: radial-gradient(circle at 50% 10%, rgba(210, 174, 114, 0.075), transparent 36%), var(--sp-shell);
    font-family: var(--sp-font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}
button { font-family: inherit; }
.hidden { display: none !important; }

/* ---------- 主容器 ---------- */
#main-container {
    width: 100%;
    max-width: 430px;
    padding: 2px 2px 10px;
    position: relative;
    text-align: center;
    opacity: 0;
    transform: scale(0.95);
    transform-origin: center;
    transition: opacity 0.5s, transform 0.5s, padding-bottom 0.45s cubic-bezier(0.2, 0.8, 0.25, 1);
}
#main-container.fade-in { opacity: 1; transform: scale(1); }
#main-container.card-mode {
    height: 100%;
    min-height: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background: transparent;
    box-shadow: none;
    border-radius: 0;
    transition: background 0.6s, box-shadow 0.6s, border-radius 0.6s, padding 0.6s;
}
body.sp-result-mode { padding: 0 !important; }
body.sp-result-mode #main-container.card-mode {
    width: 100%;
    max-width: none;
    padding: 0;
}
#main-container.card-mode #quick-draw-btn { display: none; }
body.sp-result-mode .result-card .content,
body.sp-result-mode .result-card .content .front,
body.sp-result-mode .result-card .content .back { border-radius: 30px; }
body.sp-result-mode .result-card .content .back .back-content { border-radius: 29px; }
body.sp-result-mode .result-card .content .front .front-content { border-radius: 30px; }
.sp-header-wrap { width: 100%; }

/* ---------- 顶部 ---------- */
.sp-header {
    width: 100%;
    padding: 4px 2px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
}
.sp-header-copy { min-width: 0; }
.sp-eyebrow {
    margin: 0 0 6px;
    color: var(--sp-gold);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.85;
}
.sp-title {
    margin: 0;
    color: #f5f5f4;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.03em;
    line-height: 1.2;
}
.header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.sp-chip-button {
    min-height: 32px;
    padding: 0 12px;
    border: 1px solid var(--sp-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    color: var(--sp-gold);
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
}
.sp-chip-button:hover,
.sp-chip-button:focus-visible {
    border-color: rgba(210, 174, 114, 0.72);
    background: rgba(210, 174, 114, 0.10);
    color: #f0d29a;
    box-shadow: 0 0 16px rgba(210, 174, 114, 0.14);
}

/* ---------- 四张卡 ---------- */
#cards-container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 0 0 14px;
    transform: translateY(0);
    transition: transform 0.4s ease, opacity 0.4s ease;
}
#cards-container.is-quick-drawing { transform: translateY(14px); }
.card-item {
    aspect-ratio: 3 / 2;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(210, 174, 114, 0.24);
    border-radius: var(--sp-radius-card);
    background: linear-gradient(150deg, #242120, #1a1817);
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.04), 0 8px 18px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    user-select: none;
    transition: all 0.45s ease-in-out;
}
.card-item .border-line {
    position: absolute;
    z-index: 2;
    inset: 0;
    border: 2px solid transparent;
    border-radius: inherit;
    opacity: 0;
    pointer-events: none;
    transition: all 0.45s ease-in-out;
}
.card-item .card-content {
    position: absolute;
    inset: 1px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px;
    text-align: center;
    transition: all 0.45s ease-in-out;
}
.card-item .card-content > div:first-child {
    color: var(--sp-dim);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transition: all 0.35s ease;
}
.card-item .card-value {
    display: none;
    color: var(--sp-gold-bright);
    font-size: clamp(15px, 4.4vw, 18px);
    font-weight: 600;
    line-height: 1.25;
    overflow-wrap: anywhere;
    text-align: center;
    position: relative;
    z-index: 1;
}
.card-item.active,
.card-item.revealed {
    border-color: rgba(210, 174, 114, 0.68);
    background: #1f1c19;
}
.card-item.active .border-line,
.card-item.revealed .border-line {
    opacity: 1;
    border-color: var(--sp-gold);
    box-shadow: 0 0 14px rgba(210, 174, 114, 0.35), inset 0 0 10px rgba(227, 192, 138, 0.12);
}
.card-item.active .card-content > div:first-child,
.card-item.revealed .card-content > div:first-child {
    color: rgba(227, 192, 138, 0.72);
    font-size: 8px;
}
.card-item.active .card-value { display: block; }
.card-item.revealed .card-value { display: block; animation: valuePop 0.4s ease-in-out; }
.card-item.revealed {
    transform: scale(1.03);
    border-color: transparent;
    border-radius: 0;
    background: transparent;
    overflow: visible;
}
.card-item.revealed .card-content {
    inset: 8px;
    border-radius: 10px;
    background: #1b1a19;
}
.card-item.revealed .border-line { inset: 6px; border-radius: 12px; }
@keyframes valuePop {
    0% { opacity: 0; transform: translateY(4px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* ---------- 难度弹窗 ---------- */
.modal-overlay {
    background: rgba(8, 7, 6, 0.72);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    transition: opacity 0.4s;
}
.modal-overlay.fade-out { opacity: 0; }
.modal-overlay > * { transform-origin: center; }
#diff-modal {
    padding: 0 !important;
    background: transparent;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
}
#diff-modal > div {
    width: 100%;
    max-width: none;
    height: 100%;
    max-height: none;
    display: flex;
    flex-direction: column;
    padding: 28px 22px 24px;
    border: 1px solid var(--sp-line);
    border-radius: 30px;
    background: linear-gradient(160deg, #232120, #1b1a19);
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);
    text-align: center;
}
.sp-diff-title {
    margin: 0 0 22px;
    color: var(--sp-gold);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}
.sp-diff-list {
    display: flex !important;
    flex: 1 1 auto;
    flex-direction: column !important;
    gap: 12px;
    width: 100%;
    min-height: 0;
    align-items: center;
}
.sp-diff-list > .button {
    flex: 1 1 0;
    min-height: 64px;
}
.button {
    width: 100%;
    min-height: 72px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--sp-line);
    border-radius: var(--sp-radius-card);
    background: linear-gradient(145deg, #242120, #191716);
    color: var(--sp-gold);
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.05), 0 8px 20px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.button:hover,
.button:focus-visible {
    background: #2b2622;
    border-color: rgba(210, 174, 114, 0.74);
    transform: translateY(-1px);
    box-shadow: 0 0 24px rgba(210, 174, 114, 0.16), 0 10px 24px rgba(0, 0, 0, 0.24);
}
.button:active { transform: scale(0.988); }
.button::before,
.button::after { content: none; display: none; }
.text_button {
    position: relative;
    z-index: 1;
    background: none;
    color: inherit;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.2em;
}
.btn-white { border-color: rgba(214, 211, 209, 0.34); color: #e7e5e4; }
.btn-orange { border-color: rgba(245, 158, 11, 0.44); color: #fbbf24; }
.btn-red { border-color: rgba(199, 92, 80, 0.5); color: #f0a79c; }

/* ---------- 主操作按钮 ---------- */
.btn-result,
.quick-draw-sp {
    min-height: 48px;
    padding: 0 22px;
    border: 1px solid rgba(229, 197, 143, 0.72);
    border-radius: 999px;
    background: linear-gradient(160deg, #e0bd83, #c49b5f);
    color: #201c18;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32), 0 0 22px rgba(201, 157, 85, 0.13), inset 0 1px rgba(255, 255, 255, 0.35);
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}
.btn-result { display: none; opacity: 0; margin: 0 auto; }
.btn-result.show { display: block; opacity: 1; position: absolute; left: 50%; bottom: 60px; margin: 0; transform: translateX(-50%); }
.quick-draw-sp {
    display: block;
    opacity: 1;
    width: 100%;
    margin: 0 auto 16px;
    max-height: 80px;
    overflow: hidden;
    transition: opacity 0.4s ease, transform 0.4s ease, margin 0.4s ease, max-height 0.4s ease;
}
.btn-result:hover,
.quick-draw-sp:hover {
    background: linear-gradient(160deg, #eccb93, #d3a96a);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36), 0 0 32px rgba(201, 157, 85, 0.26), inset 0 1px rgba(255, 255, 255, 0.4);
}
.quick-draw-sp.is-hidden {
    opacity: 0;
    transform: translateY(14px);
    margin-top: 0;
    margin-bottom: 0;
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    pointer-events: none;
}
.quick-draw-sp:disabled { opacity: 0.55; cursor: wait; }

/* ---------- 结果卡 ---------- */
.result-card {
    position: relative;
    width: 100%;
    height: 100%;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    margin: 0 auto;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.55s ease, transform 0.55s ease;
    display: none;
}
.result-card.show { display: block; opacity: 1; transform: scale(1); }
.result-card .content {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.32s;
    border-radius: var(--sp-radius-modal);
    background: #1b1a19;
    box-shadow: 0 0 0 1px rgba(210, 174, 114, 0.22), 0 18px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(210, 174, 114, 0.10);
}
.result-card .content .front,
.result-card .content .back {
    position: absolute;
    inset: 0;
    background: #1b1a19;
    border-radius: var(--sp-radius-modal);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}
.result-card .content .back {
    display: flex;
    align-items: center;
    justify-content: center;
}
.result-card .content .back::before {
    content: '';
    position: absolute;
    width: 160px;
    height: 160%;
    background: linear-gradient(90deg, transparent, var(--sp-gold-strong), var(--sp-gold-bright), var(--sp-gold), transparent);
    animation: rotation_481 6s linear infinite;
}
.result-card .content .back .back-content {
    position: absolute;
    inset: 1px;
    border-radius: calc(var(--sp-radius-modal) - 1px);
    background: radial-gradient(circle at 50% 38%, rgba(210, 174, 114, 0.12), transparent 46%), #171514;
    color: var(--sp-ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}
.sp-result-hand { font-size: 60px; line-height: 1; filter: drop-shadow(0 0 18px rgba(210, 174, 114, 0.18)); }
.sp-result-back-title { margin-top: 8px; color: rgba(238, 234, 231, 0.86); font-size: 34px; letter-spacing: 0.1em; text-align: center; }
.result-card.flipped .content { transform: rotateY(180deg); }
@keyframes rotation_481 {
    0% { transform: rotateZ(0deg); }
    100% { transform: rotateZ(360deg); }
}
.result-card .content .front { transform: rotateY(180deg); }
.result-card .content .front .front-content {
    position: absolute;
    inset: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid rgba(210, 174, 114, 0.28);
    border-radius: var(--sp-radius-modal);
    background: rgba(28, 25, 22, 0.92);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
}
.result-card .content .front .front-content .description {
    width: 100%;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.result-card .content .front .front-content .description .title {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
}
#result-title {
    margin: 0;
    color: #f3d39a;
    font-size: clamp(20px, 5.6vw, 28px);
    line-height: 1.3;
    text-align: center;
}
#result-title strong { font-weight: 600; }
#result-footer { margin: 0; color: var(--sp-muted); font-size: 11px; }
#count-display { color: var(--sp-gold-bright); font-size: 20px; font-weight: 600; }
.sp-count-actions { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
.sp-mini-button {
    min-height: 34px;
    padding: 0 14px;
    border: 1px solid rgba(210, 174, 114, 0.3);
    border-radius: 10px;
    background: #211d19;
    color: #d8c3a1;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.sp-mini-button:hover {
    background: rgba(210, 174, 114, 0.12);
    border-color: rgba(210, 174, 114, 0.6);
    color: #f0d29a;
}
.sp-redraw-button { margin-top: 6px; }

/* ---------- 历史 / 规则 ---------- */
.history-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(8, 7, 6, 0.74);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
}
.history-modal.open { display: flex; }
.history-dialog {
    width: 100%;
    max-width: 390px;
    max-height: 78vh;
    overflow: auto;
    padding: 22px 20px 20px;
    border: 1px solid var(--sp-line);
    border-radius: var(--sp-radius-modal);
    background: #211e1c;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), 0 0 30px rgba(210, 174, 114, 0.1);
}
.history-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.history-dialog h2 { margin: 0; color: var(--sp-gold); font-size: 16px; font-weight: 500; letter-spacing: 0.1em; }
.history-close {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(210, 174, 114, 0.45);
    border-radius: 50%;
    background: #2a211b;
    color: var(--sp-gold);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
}
.history-empty { margin: 24px 0 6px; color: var(--sp-muted); font-size: 12px; line-height: 1.7; text-align: center; }
.history-list { display: grid; gap: 10px; margin-top: 16px; }
.history-entry { padding: 12px 0; border-top: 1px solid rgba(210, 174, 114, 0.2); text-align: left; }
.history-entry:first-child { border-top: 0; padding-top: 0; }
.history-entry-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--sp-muted); font-size: 10px; }
.history-entry-meta b { color: var(--sp-gold); font-weight: 500; }
.history-entry-result { margin-top: 6px; color: #fff7ed; font-size: 12px; line-height: 1.6; }
.history-entry-count { margin-top: 3px; color: var(--sp-muted); font-size: 10px; }
.sp-modal-panel {
    width: min(100%, 390px);
    max-height: 80vh;
    overflow: auto;
    padding: 22px 20px;
    border: 1px solid var(--sp-line);
    border-radius: var(--sp-radius-modal);
    background: #211e1c;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), 0 0 30px rgba(210, 174, 114, 0.1);
    text-align: left;
}
.sp-modal-title { margin: 0 0 14px; color: var(--sp-gold); font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-align: center; }
.sp-rules-copy { display: grid; gap: 10px; color: var(--sp-muted); font-size: 11px; line-height: 1.8; }
.sp-rules-copy strong { color: var(--sp-gold-bright); }
.sp-modal-close {
    width: 100%;
    min-height: 44px;
    margin-top: 18px;
    border: 1px solid rgba(210, 174, 114, 0.4);
    border-radius: 12px;
    background: #2a211b;
    color: var(--sp-gold);
    font-size: 12px;
    letter-spacing: 0.12em;
    cursor: pointer;
}

/* ---------- 入场 ---------- */
@keyframes sp-diff-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sp-diff-panel-in { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes sp-diff-item-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
#diff-modal.is-entering { animation: sp-diff-backdrop-in 0.4s ease-out; }
#diff-modal.is-entering > div { animation: sp-diff-panel-in 0.5s cubic-bezier(0.2, 0.8, 0.25, 1) both; }
#diff-modal.is-entering > div > h2 { animation: sp-diff-item-in 0.45s 0.08s cubic-bezier(0.2, 0.8, 0.25, 1) backwards; }
#diff-modal.is-entering > div .flex.flex-col > .button { animation: sp-diff-item-in 0.45s cubic-bezier(0.2, 0.8, 0.25, 1) backwards; }
#diff-modal.is-entering > div .flex.flex-col > .button:nth-child(1) { animation-delay: 0.16s; }
#diff-modal.is-entering > div .flex.flex-col > .button:nth-child(2) { animation-delay: 0.24s; }
#diff-modal.is-entering > div .flex.flex-col > .button:nth-child(3) { animation-delay: 0.32s; }

/* ---------- 响应式 ---------- */
@media (max-width: 360px) {
    body { padding: 12px !important; }
    .sp-header { padding-bottom: 10px; }
    .sp-title { font-size: 20px; }
    .sp-chip-button { min-height: 30px; padding-inline: 10px; font-size: 10px; }
    #cards-container { gap: 8px; }
    .button { min-height: 64px; }
    .text_button { font-size: 17px; }
    .result-card .content .front .front-content { padding: 8px; }
    .result-card .content .front .front-content .description { padding: 14px 9px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
}
    </style>
</head>
<body class="sp-body">

    <div id="diff-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="sp-diff-panel">
            <h2 class="sp-eyebrow sp-diff-title">选择惩罚程度</h2>
            <div class="sp-diff-list flex flex-col w-full items-center">
                <button onclick="selectDiff(30, 50, 30)" class="button btn-white w-full" type="button">
                    <span class="text_button">轻度</span>
                </button>
                <button onclick="selectDiff(50, 80, 60)" class="button btn-orange w-full" type="button">
                    <span class="text_button">中度</span>
                </button>
                <button onclick="selectDiff(80, 110, 80)" class="button btn-red w-full" type="button">
                    <span class="text_button">重度</span>
                </button>
            </div>
        </div>
    </div>

    <div id="main-container" class="sp-main">
        <div class="flex justify-center sp-header-wrap">
            <header class="sp-header">
                <div class="sp-header-copy">
                    <p class="sp-eyebrow">NOCTURNE ARCHIVE</p>
                    <h1 class="sp-title">SP 幸运卡牌</h1>
                </div>
                <div class="header-actions">
                    <button id="rules-btn" class="sp-chip-button" type="button">规则</button>
                    <button id="history-btn" class="sp-chip-button history-trigger" type="button">历史</button>
                </div>
            </header>
        </div>

        <div id="cards-container">
            <div id="c-0" class="card-item"><div class="border-line"></div><div class="card-content"><div class="card-label">Tool</div><div class="card-value"></div></div></div>
            <div id="c-1" class="card-item"><div class="border-line"></div><div class="card-content"><div class="card-label">Pose</div><div class="card-value"></div></div></div>
            <div id="c-2" class="card-item"><div class="border-line"></div><div class="card-content"><div class="card-label">Count</div><div class="card-value"></div></div></div>
            <div id="c-3" class="card-item"><div class="border-line"></div><div class="card-content"><div class="card-label">Area</div><div class="card-value"></div></div></div>
        </div>

        <button id="quick-draw-btn" class="btn-result quick-draw-sp" type="button">一键抽卡</button>

        <div id="result-card" class="result-card">
            <div class="content">
                <div class="back">
                    <div class="back-content" id="result-back">
                        <div class="sp-result-hand" aria-hidden="true">✋</div>
                        <div class="sp-result-back-title">最终结果</div>
                    </div>
                </div>
                <div class="front">
                    <div class="front-content">
                        <div class="description">
                            <div class="title">
                                <p id="result-title"><strong></strong></p>
                                <p id="result-footer" class="card-footer"></p>
                            </div>
                            <div class="sp-count-actions">
                                <button type="button" class="sp-mini-button" onclick="event.stopPropagation(); updateCountAnim(state.currentCount + 5)">+5</button>
                                <button type="button" class="sp-mini-button" onclick="event.stopPropagation(); updateCountAnim(state.currentCount + 10)">+10</button>
                            </div>
                            <button id="redraw-btn" type="button" class="sp-mini-button sp-redraw-button" onclick="event.stopPropagation(); resetDraw(true)">重抽</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="draw-btn" class="btn-result" type="button">显示结果</button>
    </div>

    <div id="rules-modal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="sp-modal-panel sp-rules-panel">
            <h2 class="sp-modal-title">惩罚规则与联动</h2>
            <div class="sp-rules-copy">
                <p><strong>工具系数：</strong><br/>x1.0: 马鞭/手掌/猫爪/散鞭/衣架<br/>x0.95: 发刷<br/>x0.9: 皮带/小木拍/皮拍/硅胶拍/戒尺<br/>x0.8: 大木拍/数据线<br/>x0.7: 皮鞭/藤条</p>
                <p><strong>加罚说明：</strong><br/>1. 报数/声小/报错/求饶 +5次。<br/>2. 乱动/遮挡/躲闪/喊疼 +10次。<br/>(上限50次加罚)</p>
            </div>
            <button id="close-modal" class="sp-modal-close" type="button">关闭</button>
        </div>
    </div>

    <div id="history-modal" class="history-modal" role="dialog" aria-modal="true" aria-labelledby="history-title" aria-hidden="true">
        <div class="history-dialog" role="document">
            <div class="history-dialog-header">
                <h2 id="history-title">历史抽卡结果</h2>
                <button id="close-history" class="history-close" aria-label="关闭历史记录" type="button">×</button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>

<script>
        const coefficients = { "马鞭": 1, "皮带": 0.9, "手掌": 1, "发刷": 0.95, "皮鞭": 0.7, "小木拍": 0.9, "大木拍": 0.8, "皮拍": 0.9, "藤条": 0.7, "猫爪拍": 1, "散鞭": 1, "衣架": 1, "数据线": 0.8, "硅胶拍": 0.9, "戒尺": 0.9 };
        let clickSynth = null;
        let finishSynth = null;
        let finalRevealSynth = null;

        function ensureSynths() {
            if (clickSynth) return true;
            if (typeof Tone === 'undefined') return false;
            try {
                clickSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, envelope: { sustain: 0, release: 0.1 } }).toDestination();
                finishSynth = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, release: 0.2 } }).toDestination();
                finalRevealSynth = new Tone.PolySynth(Tone.Synth).toDestination();
                return true;
            } catch (e) {
                clickSynth = finishSynth = finalRevealSynth = null;
                return false;
            }
        }

        function playClick() { if (!ensureSynths()) return; try { clickSynth.triggerAttackRelease("C3", "8n"); } catch(e) {} }
        function playStop() { if (!ensureSynths()) return; try { finishSynth.triggerAttackRelease("G4", "8n"); } catch(e) {} }
        function playFinal() { if (!ensureSynths()) return; try { finalRevealSynth.triggerAttackRelease(["C4", "E4", "G4"], "2n"); } catch(e) {} }

        async function unlockAudio() {
            try {
                if (typeof Tone !== 'undefined' && typeof Tone.start === 'function') await Tone.start();
                ensureSynths();
            } catch (e) {}
        }

        const HISTORY_KEY = 'sp-card-history-v1';
        const MAX_HISTORY = 12;
        let state = { step: 0, results: [,,,], diff: {min: 50, max: 80, floor: 60}, isRolling: false, autoDrawing: false, currentCount: 0, history: loadHistory() };
        const btn = document.getElementById('draw-btn');
        const quickDrawBtn = document.getElementById('quick-draw-btn');
        const container = document.getElementById('cards-container');
        const historyModal = document.getElementById('history-modal');
        const historyList = document.getElementById('history-list');

        function loadHistory() {
            try {
                const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (e) { return []; }
        }

        function saveHistory() {
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history)); } catch (e) {}
        }

        function renderHistory() {
            if (!state.history.length) {
                historyList.innerHTML = '<p class="history-empty">完成一组四卡组合后，结果会显示在这里。</p>';
                return;
            }
            historyList.innerHTML = state.history.map((entry) => `
                <article class="history-entry">
                    <div class="history-entry-meta"><b>${entry.time}</b><span>${entry.difficulty}</span></div>
                    <div class="history-entry-result">${entry.tool} · ${entry.pose} · ${entry.area}</div>
                    <div class="history-entry-count">基础次数 ${entry.rawCount}次 · 最终次数 ${entry.finalCount}次</div>
                </article>
            `).join('');
        }

        function openHistory() {
            renderHistory();
            historyModal.classList.add('open');
            historyModal.setAttribute('aria-hidden', 'false');
        }

        function closeHistory() {
            historyModal.classList.remove('open');
            historyModal.setAttribute('aria-hidden', 'true');
        }

        function selectDiff(min, max, floor) {
            state.diff = {min, max, floor};
            const modal = document.getElementById('diff-modal');
            modal.classList.add('fade-out');
            document.getElementById('main-container').classList.add('fade-in');
            setTimeout(() => modal.classList.add('hidden'), 500);
        }
        document.getElementById('rules-btn').onclick = () => document.getElementById('rules-modal').classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => document.getElementById('rules-modal').classList.add('hidden');
        document.getElementById('history-btn').onclick = openHistory;
        document.getElementById('close-history').onclick = closeHistory;
        historyModal.onclick = (event) => { if (event.target === historyModal) closeHistory(); };
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeHistory(); });

        async function updateCountAnim(newCount) {
            const display = document.getElementById('count-display');
            const oldCount = state.currentCount;
            const steps = Math.abs(newCount - oldCount);
            const duration = 600;
            const interval = steps === 0 ? 0 : duration / (steps + 1);
            for (let i = 0; i <= steps; i++) {
                const val = newCount >= oldCount ? oldCount + i : oldCount - i;
                display.innerText = val + "次";
                playClick();
                await new Promise(r => setTimeout(r, interval));
            }
            state.currentCount = newCount;
        }

        function getPool(index) {
            if (index === 2) {
                const pool = [];
                for (let i = state.diff.min; i <= state.diff.max; i++) pool.push(i + "次");
                return pool;
            }
            const pools = [["马鞭", "皮带", "手掌", "发刷", "皮鞭", "小木拍", "大木拍", "皮拍", "藤条", "猫爪拍", "散鞭", "衣架", "数据线", "硅胶拍", "戒尺"], ["膝上", "俯卧", "跪姿", "弯腰岔腿", "扶手", "尿布", "四足支撑", "趴桌", "跪趴", "支椅背", "弯腰握踝", "椅子分腿"], [], ["屁股", "大腿根", "脚心", "手心", "小腿肚", "大腿肚", "阴部", "臀缝", "小臂", "大臂", "脸", "胸部"]];
            if (index === 3) {
                const pose = state.results[1];
                const tool = state.results[0];
                const legs = (pose !== "膝上" && tool !== "手掌") ? ["小腿肚", "大腿肚"] : [];
                let areas = pose === "膝上"
                    ? ["屁股"]
                    : ["屁股", "大腿根", "阴部", "臀缝", ...(pose === "跪姿" ? ["手心", "小臂", "大臂"] : []), ...((pose === "跪姿" || pose === "椅子分腿") ? ["胸部", "脸"] : []), ...((pose === "俯卧" || pose === "尿布" || pose === "跪趴") ? ["脚心"] : []), ...legs];
                if (tool === "手掌") areas = areas.filter((area) => ["脸", "阴部", "屁股", "胸部"].includes(area));
                return areas.length ? areas : ["屁股"];
            }
            return [...pools[index]];
        }

        async function cardClick(index) {
            await unlockAudio();
            if (state.results[index]) return;
            if (index !== state.step) return;
            if (!state.autoDrawing) quickDrawBtn.classList.add('is-hidden');

            const cardEl = document.getElementById(`c-${index}`);
            const valueEl = cardEl.querySelector('.card-value');

            if (state.isRolling) {
                state.isRolling = false;
                return;
            }

            state.isRolling = true;
            cardEl.classList.add('active');
            const pool = getPool(index);

            while (state.isRolling) {
                valueEl.textContent = weightedPick(pool, index);
                playClick();
                await new Promise(r => setTimeout(r, 100));
            }

            const result = valueEl.textContent;
            cardEl.classList.remove('active');
            cardEl.classList.add('revealed');
            state.results[index] = result;
            playStop();
            state.step++;

            if (state.step === 4) {
                document.getElementById('main-container').style.paddingBottom = '120px';
                btn.style.display = 'block';
                requestAnimationFrame(() => btn.classList.add('show'));
            }
        }

        async function quickDraw() {
            if (state.autoDrawing || state.isRolling || state.step >= 4) return;
            state.autoDrawing = true;
            quickDrawBtn.disabled = true;
            quickDrawBtn.classList.add('is-hidden');
            container.classList.add('is-quick-drawing');
            for (let index = state.step; index < 4; index++) {
                cardClick(index);
                await new Promise(r => setTimeout(r, 520));
                cardClick(index);
                while (!state.results[index]) await new Promise(r => setTimeout(r, 40));
                await new Promise(r => setTimeout(r, 180));
            }
            state.autoDrawing = false;
            quickDrawBtn.disabled = false;
        }

        function weightedPick(pool, index) {
            if (!pool.length) return '';
            const recentValues = state.history.slice(0, 4).map((entry) => [entry.tool, entry.pose, entry.rawCount + '次', entry.area][index]);
            const weights = pool.map((value) => {
                let weight = 1;
                const repeatCount = recentValues.filter((previousValue) => value === previousValue).length;
                if (repeatCount) weight *= Math.pow(0.42, repeatCount);
                if (index === 3 && value === '屁股') weight *= 0.24;
                return weight;
            });
            const total = weights.reduce((sum, weight) => sum + weight, 0);
            let cursor = Math.random() * total;
            for (let i = 0; i < pool.length; i++) {
                cursor -= weights[i];
                if (cursor <= 0) return pool[i];
            }
            return pool[pool.length - 1];
        }

        function resetDraw(showDifficulty = false) {
            state.step = 0;
            state.results = [,,,];
            state.isRolling = false;
            state.autoDrawing = false;
            state.currentCount = 0;
            quickDrawBtn.classList.remove('is-hidden');
            container.classList.remove('is-quick-drawing');
            for (let i = 0; i < 4; i++) {
                const card = document.getElementById(`c-${i}`);
                card.classList.remove('active', 'revealed');
                card.querySelector('.card-value').textContent = '';
            }
            container.classList.remove('hidden');
            container.style.opacity = '1';
            container.style.display = '';
            const header = mainContainer.querySelector('.flex.justify-center');
            if (header) {
                header.style.opacity = '1';
                header.style.display = '';
            }
            mainContainer.classList.remove('card-mode');
            document.body.classList.remove('sp-result-mode');
            mainContainer.style.height = '';
            resultCard.classList.remove('show', 'flipped');
            resultCard.style.display = 'none';
            resultCard.onclick = null;
            btn.classList.remove('show');
            btn.style.display = 'none';
            btn.style.opacity = '1';
            mainContainer.style.paddingBottom = '';
            if (showDifficulty) {
                const diffModal = document.getElementById('diff-modal');
                diffModal.classList.remove('hidden', 'fade-out');
                replayDiffEntrance();
            }
        }

        function replayDiffEntrance() {
            const diffModal = document.getElementById('diff-modal');
            if (!diffModal || diffModal.classList.contains('hidden')) return;
            diffModal.classList.remove('is-entering');
            void diffModal.offsetWidth;
            diffModal.classList.add('is-entering');
            clearTimeout(replayDiffEntrance.timer);
            replayDiffEntrance.timer = setTimeout(() => diffModal.classList.remove('is-entering'), 1200);
            diffModal.querySelectorAll('.dots_border').forEach((el) => {
                el.getAnimations().forEach((animation) => { animation.cancel(); animation.play(); });
            });
        }
        window.replayDiffEntrance = replayDiffEntrance;

        for (let i = 0; i < 4; i++) document.getElementById(`c-${i}`).onclick = () => cardClick(i);
        quickDrawBtn.onclick = quickDraw;
        btn.onclick = () => { const targetHeight = mainContainer.offsetHeight; showResult(targetHeight); btn.classList.remove('show'); document.getElementById('main-container').style.paddingBottom = ''; };

        const mainContainer = document.getElementById('main-container');
        const resultCard = document.getElementById('result-card');

        async function showResult(baseHeight) {
            const header = mainContainer.querySelector('.flex.justify-center');
            container.style.opacity = '0';
            btn.style.opacity = '0';
            if (header) header.style.opacity = '0';
            setTimeout(async () => {
                container.classList.add('hidden');
                btn.style.display = 'none';
                if (header) header.style.display = 'none';
                mainContainer.classList.add('card-mode');
                document.body.classList.add('sp-result-mode');
                if (baseHeight > 0) mainContainer.style.height = `${baseHeight}px`;

                const rawCount = parseInt(state.results[2]);
                const coeff = coefficients[state.results[0]] || 1;
                const calculatedCount = Math.max(state.diff.floor, Math.round(rawCount * coeff));

                state.history.unshift({
                    time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    difficulty: `${state.diff.min}-${state.diff.max}次`,
                    tool: state.results[0],
                    pose: state.results[1],
                    area: state.results[3],
                    rawCount,
                    finalCount: calculatedCount,
                });
                state.history = state.history.slice(0, MAX_HISTORY);
                saveHistory();

                const summary = `${state.results[0]} | ${state.results[1]} | ${state.results[3]}`;
                document.getElementById('result-title').innerHTML = `<strong>${summary}</strong>`;
                document.getElementById('result-footer').innerHTML = `基础惩罚: ${rawCount}次 · <span id="count-display">${rawCount}次</span>`;
                let countStarted = false;
                resultCard.style.display = 'block';
                resultCard.onclick = () => {
                    resultCard.classList.toggle('flipped');
                    if (!countStarted && resultCard.classList.contains('flipped')) {
                        countStarted = true;
                        const content = resultCard.querySelector('.content');
                        const handler = () => {
                            content.removeEventListener('transitionend', handler);
                            state.currentCount = rawCount;
                            updateCountAnim(calculatedCount);
                            playFinal();
                        };
                        content.addEventListener('transitionend', handler);
                    }
                };
                requestAnimationFrame(() => resultCard.classList.add('show'));
            }, 400);
        }

        const fitContainer = () => {
            const container = document.getElementById('main-container');
            if (!container) return;
            container.style.scale = '';
            const bodyStyle = getComputedStyle(document.body);
            const availableWidth = document.documentElement.clientWidth - parseFloat(bodyStyle.paddingLeft) - parseFloat(bodyStyle.paddingRight);
            const availableHeight = document.documentElement.clientHeight - parseFloat(bodyStyle.paddingTop) - parseFloat(bodyStyle.paddingBottom);
            const scale = Math.min(1, availableWidth / container.offsetWidth, availableHeight / container.offsetHeight);
            container.style.scale = scale < 0.999 ? String(scale) : '';
        };
        const fitOverlayPanels = () => {
            document.querySelectorAll('.modal-overlay').forEach((overlay) => {
                const panel = overlay.firstElementChild;
                if (!panel) return;
                if (overlay.id === 'diff-modal') {
                    panel.style.scale = '';
                    return;
                }
                panel.style.scale = '';
                if (overlay.classList.contains('hidden') || !panel.offsetWidth) return;
                const availableWidth = document.documentElement.clientWidth - 32;
                const availableHeight = document.documentElement.clientHeight - 32;
                const scale = Math.min(1, availableWidth / panel.offsetWidth, availableHeight / panel.offsetHeight);
                panel.style.scale = scale < 0.999 ? String(scale) : '';
            });
        };
        document.querySelectorAll('.modal-overlay').forEach((overlay) => {
            new MutationObserver(fitOverlayPanels).observe(overlay, { attributes: true, attributeFilter: ['class'] });
        });
        const overlayPanelObserver = new ResizeObserver(fitOverlayPanels);
        document.querySelectorAll('.modal-overlay > *').forEach((panel) => overlayPanelObserver.observe(panel, { box: 'border-box' }));
        new ResizeObserver(fitContainer).observe(document.getElementById('main-container'), { box: 'border-box' });
        window.addEventListener('resize', () => { fitContainer(); fitOverlayPanels(); });
        fitContainer();
        fitOverlayPanels();
        replayDiffEntrance();
    </script>
</body>
</html>
